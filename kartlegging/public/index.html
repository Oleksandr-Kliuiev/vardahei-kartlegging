<title>Vardahei kartlegging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: éi smal, venstrejustert kolonne. Eitt spørsmål om gongen. Framdrifta er ein høgdeprofil: ein turgåar går frå dalen og opp til tre graner på toppen. */
:root {
  --bg: #eef2f4;
  --surface: #f9fbfc;
  --ink: #1e2a31;
  --muted: #5d6a71;
  --line: #c6d1d7;
  --accent: #176e91;
  --accent-ink: #ffffff;
  --accent-soft: #dcebf2;
  --feil: #b3402f;
  --fjell: #dde6eb;
  --fjell-bak: #e6edf1;
  --sno: #ffffff;
  --stein: #8a8c90;
  --gran: #2f5f4c; --gran-lys: #3f7a60; --stamme: #6b4a33;
  --telt: #e08a2c; --telt-skugge: #bf6f1d; --telt-dor: #5a3a1c;
  --eld-1: #e2572b; --eld-2: #f39a2b; --eld-3: #fcd25a; --glod: #f39a2b;
  --hud: #e9b99a; --lue: #c8432f; --sekk: #3f3f43;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --logo-filter: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10191e; --surface: #17242b; --ink: #e3eaee; --muted: #9aabb3; --line: #2c3d46;
    --accent: #5fb0d3; --accent-ink: #08161d; --accent-soft: #183544; --feil: #ec7b66;
    --fjell: #1b2a32; --fjell-bak: #15222a; --sno: #c7d6dd; --stein: #8c9095; --stein-mork: #c3c6ca; --gran: #4b8a6c; --gran-lys: #62a283; --stamme: #8d6a4f; --telt: #e8973c; --telt-skugge: #c47726; --telt-dor: #3b2614; --hud: #e2b394; --lue: #e0614b; --sekk: #8c9095;
    --logo-filter: brightness(1.45) saturate(.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10191e; --surface: #17242b; --ink: #e3eaee; --muted: #9aabb3; --line: #2c3d46;
  --accent: #5fb0d3; --accent-ink: #08161d; --accent-soft: #183544; --feil: #ec7b66;
  --fjell: #1b2a32; --fjell-bak: #15222a; --sno: #c7d6dd; --stein: #8c9095; --stein-mork: #c3c6ca; --gran: #4b8a6c; --gran-lys: #62a283; --stamme: #8d6a4f; --telt: #e8973c; --telt-skugge: #c47726; --telt-dor: #3b2614; --hud: #e2b394; --lue: #e0614b; --sekk: #8c9095;
  --logo-filter: brightness(1.45) saturate(.9); color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 36rem; margin: 0 auto; padding-inline: 18px; padding-block: 14px 120px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: block; height: 26px; width: auto; filter: var(--logo-filter); }
.sprak { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.sprak button {
  font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted);
  padding: 4px 12px; cursor: pointer;
}
.sprak button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Høgdeprofilen: ein turgåar går opp mot toppen. Der står tre graner, og når du er ferdig, kjem teltet og bålet. */
.fjell { position: relative; margin-top: 10px; height: 118px; }
.fjell svg { display: block; width: 100%; height: 118px; overflow: visible; }
.fjell .gatt-rect { transition: width .9s cubic-bezier(.4, .1, .2, 1); }
.fjell .gaar { transition: transform .9s cubic-bezier(.4, .1, .2, 1); }
.fjell .prikk { transition: fill .3s, stroke .3s, opacity .3s; }
.fjell-merke {
  position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent-ink);
  background: var(--accent); border-radius: 6px; padding: 1px 8px; line-height: 1.5;
  transition: left .9s cubic-bezier(.4, .1, .2, 1), top .9s cubic-bezier(.4, .1, .2, 1);
}
.fjell-merke::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: 0; border-top-color: var(--accent); }

/* Turgåaren: beina går berre medan han flyttar seg */
.fjell .kropp { animation: none; }
.fjell .bein { transform: rotate(0deg); }
.fjell.gaar-no .kropp { animation: vugge .3s ease-in-out 3 alternate; }
.fjell.gaar-no .bein.a { animation: steg-a .3s ease-in-out 3 alternate; }
.fjell.gaar-no .bein.b { animation: steg-b .3s ease-in-out 3 alternate; }
@keyframes steg-a { from { transform: rotate(-24deg); } to { transform: rotate(22deg); } }
@keyframes steg-b { from { transform: rotate(22deg); } to { transform: rotate(-24deg); } }
@keyframes vugge { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }

/* Telt og bål dukkar opp når turgåaren er framme */
.fjell .telt, .fjell .baal { opacity: 0; transform: scale(0); }
.fjell.ferdig .telt { animation: reis 0.6s 1s cubic-bezier(.3, 1.5, .5, 1) forwards; }
.fjell.ferdig .baal { animation: reis 0.45s 1.6s cubic-bezier(.3, 1.5, .5, 1) forwards; }
@keyframes reis { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
.fjell .flamme { transform-origin: 0 0; }
.fjell.ferdig .flamme.f1 { animation: flakk .45s ease-in-out infinite alternate; }
.fjell.ferdig .flamme.f2 { animation: flakk .38s .1s ease-in-out infinite alternate-reverse; }
.fjell.ferdig .flamme.f3 { animation: flakk .52s .2s ease-in-out infinite alternate; }
@keyframes flakk { from { transform: scale(1, 1) skewX(0deg); } to { transform: scale(.85, 1.18) skewX(-6deg); } }
.fjell .gnist { opacity: 0; }
.fjell.ferdig .gnist { animation: gnist 1.6s ease-out infinite; }
.fjell.ferdig .gnist.g2 { animation-delay: .55s; }
.fjell.ferdig .gnist.g3 { animation-delay: 1.1s; }
@keyframes gnist { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(3px, -16px); } }

main { margin-top: 26px; }
.skjerm { animation: inn .28s ease both; }
@keyframes inn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

h1 { font-size: clamp(2rem, 7vw, 2.6rem); line-height: 1.1; margin: 0 0 18px; text-wrap: balance; letter-spacing: -.01em; }
.brev p { margin: 0 0 14px; max-width: 34em; }
.fakta { list-style: none; padding: 0; margin: 22px 0 26px; display: grid; gap: 10px; }
.fakta li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
.fakta svg { width: 20px; height: 20px; margin-top: 3px; color: var(--accent); }
.helsing { margin-top: 26px; color: var(--muted); font-style: italic; }
.kunde { display: inline-block; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 1px 8px; font-weight: 700; }

.ingress { font-size: 15px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.sp { font-size: clamp(1.3rem, 4.6vw, 1.65rem); line-height: 1.3; font-weight: 700; margin: 0 0 8px; text-wrap: pretty; }
.scenario .sp { font-weight: 400; }
.scenario .sitat { display: block; margin: 10px 0; padding-left: 14px; border-left: 3px solid var(--accent); font-style: italic; }
.hjelp { color: var(--muted); margin: 0 0 18px; font-size: 16px; }

.val { display: grid; gap: 8px; margin-top: 18px; }
.opt {
  display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: center; text-align: left;
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--r); padding: 13px 14px; cursor: pointer; min-height: 52px;
  transition: border-color .12s, background-color .12s;
}
.opt:hover { border-color: var(--muted); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[disabled] { opacity: .45; cursor: not-allowed; }
.opt .ind { width: 22px; height: 22px; border: 2px solid var(--muted); display: grid; place-items: center; }
.opt[role="radio"] .ind { border-radius: 50%; }
.opt[role="checkbox"] .ind { border-radius: 5px; }
.opt[aria-checked="true"] .ind { border-color: var(--accent); background: var(--accent); }
.opt[aria-checked="true"] .ind::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
.opt[role="checkbox"][aria-checked="true"] .ind::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink); transform: rotate(-45deg) translate(1px, -1px); }

textarea, input[type="text"] {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; resize: vertical;
}
textarea { min-height: 110px; }
input.stor { max-width: 240px; font-size: 1.35rem; letter-spacing: .12em; text-transform: uppercase; }
.fri { margin-top: 14px; }
.fri label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px; }

.skala { display: grid; gap: 18px; margin-top: 18px; }
.skala-rad .namn { margin-bottom: 8px; }
.skala-knappar { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
.skala-knappar button {
  font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; min-height: 46px; cursor: pointer; padding: 0;
}
.skala-knappar button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.skala-endar { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: 6px; }
.nps .skala-knappar { grid-template-columns: repeat(11, 1fr); gap: 4px; }
@media (max-width: 460px) { .nps .skala-knappar { grid-template-columns: repeat(6, 1fr); } }

/* Navigasjon nedst */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
}
.nav-inn { max-width: 36rem; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.knapp {
  font: inherit; font-weight: 700; border-radius: var(--r); padding: 12px 22px; cursor: pointer; border: 1.5px solid transparent;
}
.knapp.hoved { background: var(--accent); color: var(--accent-ink); margin-left: auto; }
.knapp.hoved[disabled] { opacity: .4; cursor: not-allowed; }
.lenke { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 4px; }
.lenke:hover { color: var(--ink); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Del B-intro og slutt */
.mellom h2, .slutt h2 { font-size: 1.5rem; margin: 0 0 10px; line-height: 1.2; }
.slutt h1 { margin-bottom: 10px; }
.slutt section { margin-top: 34px; }
.fasit { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
.fasit h3, .tips h3 { margin: 0 0 6px; font-size: 1.1rem; }
.fasit .ditt { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
.fasit .ditt b { color: var(--ink); }
.merk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--accent); }
.tips { display: grid; gap: 22px; margin-top: 14px; }
.tips article { padding-left: 16px; border-left: 3px solid var(--accent); }
.tips p, .fasit p { margin: 0; }
.kontakt { margin-top: 10px; display: grid; gap: 2px; font-size: 16px; }
.kontakt span { user-select: all; font-weight: 700; }
.kontakt small { color: var(--muted); font-size: 14px; }
.notis { margin-top: 18px; font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; }
.feil { margin-top: 18px; color: var(--feil); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .skjerm { animation: none; } .fjell *, .fjell-merke { transition: none !important; animation: none !important; }
  .fjell.ferdig .telt, .fjell.ferdig .baal { opacity: 1; transform: none; }
}
</style>

      el("p", { text: u(tilstand.stengd ? "stengdTekst" : "ugyldigTekst") }),
      el("div", { class: "kontakt" }, [el("div", null, [el("span", { text: K.kontakt.telefon })]), el("div", null, [el("span", { text: K.kontakt.epost })])])
    ]));
  }

  function teiknVal() {
    sti(false);
    var d = el("div", { class: "skjerm" }, [
      el("h1", { text: u("hei") }),
      el("h2", { class: "sp", text: u("velTittel") }),
      el("p", { class: "hjelp", text: u("velTekst") })
    ]);
    var liste = el("div", { class: "val" });
    Object.keys(K.skjema).forEach(function (id) {
      var f = K.skjema[id];
      liste.appendChild(el("button", { type: "button", class: "opt", style: "grid-template-columns:1fr", onclick: function () {
        F = f; skjemaId = id; SP = F.sporsmal;
        A = SP.filter(function (s) { return s.del === "A"; }); B = SP.filter(function (s) { return s.del === "B"; }); ROLLE = rolleSp(SP);
        LAGER = "vardahei-kartlegging-utkast-" + id;
        try { history.replaceState(null, "", location.pathname + location.search + "#" + id); } catch (e) {}
        last(); teikn();
      } }, [el("span", { text: L(f.namn) })]));
    });
    d.appendChild(liste);
    main.appendChild(d);
    nav.hidden = true;
  }

  function teiknBIntro() {
    sti(true);
    meld({ sp: "B-intro" });
    main.appendChild(el("div", { class: "skjerm mellom" }, [
      el("h2", { text: L(F.leiar.tittel) }),
      el("p", { text: u("bTekst0") + " " + L(F.leiar.tekst) }),
      el("p", { text: u("bTekst2") })
    ]));
    navSett({ tilbake: true, hopp: true, hoppTekst: u("bHopp"), vidare: true, vidareTekst: u("bStart") });
  }

  function sisteSteg() { return tilstand.steg === steg().length - 1; }

  function teiknSp(s) {
    sti(true);
    meld({ sp: s.id, nr: spSteg().indexOf(s) + 1, totalt: spSteg().length });
    var boks = el("div", { class: "skjerm" + (s.scenario ? " scenario" : "") });
    if (s.ingress) boks.appendChild(el("div", { class: "ingress", text: L(s.ingress) }));

    var tekst = L(s.tekst);
    var h = el("h2", { class: "sp", id: "sp-" + s.id });
    if (s.scenario) {
      // Set sitatet i guillemets på eiga linje
      var m = tekst.match(/^(.*?)([«“].*[»”])(.*)$/);
      if (m) { h.appendChild(document.createTextNode(m[1])); h.appendChild(el("span", { class: "sitat", text: m[2] })); h.appendChild(document.createTextNode(m[3].trim())); }
      else h.textContent = tekst;
    } else h.textContent = tekst;
    boks.appendChild(h);

    var hjelpTekst = s.hjelp ? L(s.hjelp) : (s.maks && !s.hjelp ? u("maks")(s.maks) : "");
    if (hjelpTekst) boks.appendChild(el("p", { class: "hjelp", text: hjelpTekst }));

    var verdi = tilstand.svar[s.id];
    var ok = function () { return true; };

    if (s.type === "single" || s.type === "multi") {
      var multi = s.type === "multi";
      var liste = el("div", { class: "val", role: multi ? "group" : "radiogroup", "aria-labelledby": "sp-" + s.id });
      var gjeld = valAv(s);
      var finst = function (id) { return gjeld.some(function (v) { return v.id === id; }); };
      var valt = multi ? (verdi || []).filter(finst) : (finst(verdi) ? verdi : undefined);
      var friBoks = null;

      var oppdater = function () {
        Array.prototype.forEach.call(liste.children, function (b) {
          var id = b.getAttribute("data-id");
          var on = multi ? valt.indexOf(id) > -1 : valt === id;
          b.setAttribute("aria-checked", String(on));
          if (multi && s.maks) b.disabled = !on && valt.length >= s.maks;
        });
        if (friBoks) friBoks.hidden = s.fritekstNaar ? !valt.some(function (v) { return s.fritekstNaar.indexOf(v) > -1; }) : false;
        bVidare.disabled = multi ? valt.length < (s.minst || 1) : !valt;
      };

      gjeld.forEach(function (v) {
        var b = el("button", { type: "button", class: "opt", role: multi ? "checkbox" : "radio", "data-id": v.id, "aria-checked": "false" }, [el("span", { class: "ind", "aria-hidden": "true" }), el("span", { text: L(v) })]);
        b.addEventListener("click", function () {
          if (multi) {
            var i = valt.indexOf(v.id);
            if (i > -1) valt.splice(i, 1);
            else {
              if (v.aleine) valt = [];
              else valt = valt.filter(function (x) { var ov = s.val.filter(function (y) { return y.id === x; })[0]; return !(ov && ov.aleine); });
              if (!s.maks || valt.length < s.maks) valt.push(v.id);
            }
            tilstand.svar[s.id] = valt.slice();
            oppdater(); lagre();
          } else {
            valt = v.id; tilstand.svar[s.id] = valt; oppdater(); lagre();
            if (!s.fritekst) setTimeout(function () { if (steg()[tilstand.steg] === s) fram(); }, 260);
          }
        });
        liste.appendChild(b);
      });
      boks.appendChild(liste);

      if (s.fritekst) {
        var fid = "fri-" + s.id;
        var ta = el("input", { type: "text", id: fid, maxlength: "500" });
        ta.value = tilstand.fri[s.id] || "";
        ta.addEventListener("input", function () { tilstand.fri[s.id] = ta.value; lagre(); });
        friBoks = el("div", { class: "fri" }, [el("label", { for: fid, text: L(s.fritekst) }), ta]);
        boks.appendChild(friBoks);
      }
      main.appendChild(boks);
      navSett({ tilbake: true, hopp: !s.paakravd, vidare: multi || !!s.fritekst || !!verdi, vidareTekst: sisteSteg() ? u("send") : u("vidare"), lat: true });
      oppdater();
      return;
    }

    if (s.type === "text") {
      var tid = "tekst-" + s.id;
      // einlinje: eitt felt på ei linje (til dømes initialar). stor: store bokstavar. paakravd: kan ikkje hoppast over.
      var t = s.einlinje
        ? el("input", { type: "text", id: tid, maxlength: String(s.maksLengd || 80), autocomplete: "off", autocapitalize: s.stor ? "characters" : "sentences", "aria-labelledby": "sp-" + s.id, class: s.stor ? "stor" : null })
        : el("textarea", { id: tid, maxlength: "1500", "aria-labelledby": "sp-" + s.id });
      if (s.plasshaldar) t.setAttribute("placeholder", L(s.plasshaldar));
      t.value = verdi || "";
      var gyldig = function () { var v = (t.value || "").trim(); return s.paakravd ? v.length >= (s.minstLengd || 2) : true; };
      t.addEventListener("input", function () {
        if (s.stor) { var pos = t.selectionStart; t.value = t.value.toUpperCase(); try { t.setSelectionRange(pos, pos); } catch (e) {} }
        tilstand.svar[s.id] = t.value; lagre();
        bVidare.disabled = !gyldig();
      });
      boks.appendChild(t);
      main.appendChild(boks);
      navSett({ tilbake: true, hopp: !s.paakravd, vidare: true, vidareTekst: sisteSteg() ? u("send") : u("vidare"), lat: !gyldig() });
      if (s.einlinje) setTimeout(function () { try { t.focus(); } catch (e) {} }, 50);
      return;
    }

    if (s.type === "scale" || s.type === "nps") {
      var vals = verdi && typeof verdi === "object" ? Object.assign({}, verdi) : {};
      var rader = s.type === "nps" ? [{ id: "nps", nn: "", en: "" }] : s.rader;
      var n = s.skala.max - s.skala.min + 1;
      var wrap = el("div", { class: "skala" + (s.type === "nps" ? " nps" : "") });
      var fullt = function () { return rader.every(function (r) { return vals[r.id] != null; }); };
      rader.forEach(function (r) {
        var radEl = el("div", { class: "skala-rad", role: "radiogroup", "aria-label": L(r) || L(s.tekst) });
        if (L(r)) radEl.appendChild(el("div", { class: "namn", text: L(r) }));
        var kn = el("div", { class: "skala-knappar" });
        kn.style.setProperty("--n", n);
        for (var x = s.skala.min; x <= s.skala.max; x++) (function (x) {
          var b = el("button", { type: "button", role: "radio", "aria-checked": String(vals[r.id] === x), text: String(x) });
          b.addEventListener("click", function () {
            vals[r.id] = x;
            Array.prototype.forEach.call(kn.children, function (c) { c.setAttribute("aria-checked", String(c.textContent === String(x))); });
            tilstand.svar[s.id] = s.type === "nps" ? x : Object.assign({}, vals);
            bVidare.disabled = !fullt(); lagre();
          });
          kn.appendChild(b);
        })(x);
        radEl.appendChild(kn);
        radEl.appendChild(el("div", { class: "skala-endar" }, [el("span", { text: L(s.skala.lav) }), el("span", { text: L(s.skala.hog) })]));
        wrap.appendChild(radEl);
      });
      if (s.type === "nps" && typeof verdi === "number") vals.nps = verdi;
      boks.appendChild(wrap);
      if (s.fritekst) {
        var nid = "fri-" + s.id;
        var inp = el("textarea", { id: nid, maxlength: "800" });
        inp.style.minHeight = "80px";
        inp.value = tilstand.fri[s.id] || "";
        inp.addEventListener("input", function () { tilstand.fri[s.id] = inp.value; lagre(); });
        boks.appendChild(el("div", { class: "fri" }, [el("label", { for: nid, text: L(s.fritekst) }), inp]));
      }
      main.appendChild(boks);
      navSett({ tilbake: true, hopp: true, vidare: true, vidareTekst: sisteSteg() ? u("send") : u("vidare"), lat: !fullt() });
    }
  }

  /* ---------- Flyt ---------- */
  function fram() {
    if (tilstand.steg < 0) { tilstand.steg = 0; if (!tilstand.start) tilstand.start = Date.now(); }
    else if (sisteSteg()) { send(); return; }
    else tilstand.steg++;
    lagre(); teikn(); window.scrollTo(0, 0);
  }
  function bak() {
    if (tilstand.steg <= 0) tilstand.steg = -1; else tilstand.steg--;
    lagre(); teikn(); window.scrollTo(0, 0);
  }
  function hopp() {
    var s = steg()[tilstand.steg];
    if (s === "B-intro") { send(true); return; }
    delete tilstand.svar[s.id]; delete tilstand.fri[s.id];
    if (sisteSteg()) { send(); return; }
    tilstand.steg++; lagre(); teikn(); window.scrollTo(0, 0);
  }

  function rydd() {
    // Ta med berre svar på spørsmål som faktisk var med i flyten, og berre val som var synlege
    var ider = [];
    var ut = {};
    spSteg().forEach(function (sp) {
      var id = sp.id, v = tilstand.svar[id];
      ider.push(id);
      if (sp.val && !tomt(v)) {
        var lov = valAv(sp).map(function (x) { return x.id; });
        v = Array.isArray(v) ? v.filter(function (x) { return lov.indexOf(x) > -1; }) : (lov.indexOf(v) > -1 ? v : null);
      }
      if (tomt(v)) return;
      if (typeof v === "string") { v = v.trim().slice(0, 1500); if (sp.stor) v = v.toUpperCase(); }
      ut[id] = v;
    });
    var fri = {};
    Object.keys(tilstand.fri).forEach(function (id) { var t = (tilstand.fri[id] || "").trim(); if (t && ider.indexOf(id) > -1) fri[id] = t.slice(0, 800); });
    return { svar: ut, fri: fri };
  }

  function send(utanB) {
    if (utanB) { B.forEach(function (s) { delete tilstand.svar[s.id]; delete tilstand.fri[s.id]; }); tilstand.utanB = true; }
    var r = rydd();
    var data = {
      skjema: F.id, k: kundeSlug, t: tilgang, lang: tilstand.lang, versjon: K.versjon,
      leiardel: erLeiar() && !tilstand.utanB,
      sekund: tilstand.start ? Math.round((Date.now() - tilstand.start) / 1000) : null,
      svar: r.svar, fri: r.fri
    };
    tilstand.sending = true; tilstand.feil = false; teikn();
    var ferdig = function (ok, forhand) {
      tilstand.sending = false;
      if (ok) { tilstand.sendt = true; tilstand.forhand = !!forhand; slett(); }
      else tilstand.feil = true;
      teikn(); window.scrollTo(0, 0);
    };
    if (erForhand) { setTimeout(function () { ferdig(true, true); }, 300); return; }
    fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
      .then(function (res) {
        if (res.status === 403 || res.status === 410) { tilstand.sending = false; tilstand[res.status === 403 ? "ugyldig" : "stengd"] = true; teikn(); return; }
        if (res.ok) meld({ ferdig: true });
        ferdig(res.ok);
      })
      .catch(function () { ferdig(false); });
  }

  function valTekst(s, id) { var v = s.val.filter(function (x) { return x.id === id; })[0]; return v ? L(v) : id; }

  function teiknSlutt() {
    sti(!!(tilstand.sendt && !tilstand.feil), true);
    nav.hidden = true;
    if (tilstand.sending) { main.appendChild(el("p", { class: "skjerm", text: u("sender") })); return; }
    if (tilstand.feil) {
      main.appendChild(el("div", { class: "skjerm" }, [
        el("p", { class: "feil", text: u("sendFeil") }),
        el("button", { type: "button", class: "knapp hoved", style: "margin-left:0", text: u("provIgjen"), onclick: function () { send(); } })
      ]));
      return;
    }
    var svar = tilstand.svar;
    var d = el("div", { class: "skjerm slutt" });
    d.appendChild(el("h1", { text: u("takk") }));
    d.appendChild(el("p", { text: u("sendt") }));
    if (tilstand.forhand) d.appendChild(el("p", { class: "notis", text: u("ikkjeSendt") }));

    // Situasjonane (berre i skjema som har dei)
    var scen = SP.filter(function (s) { return s.scenario; });
    var sit = el("section");
    if (scen.length) sit.appendChild(el("h2", { text: u(scen.length === 1 ? "situasjonen" : "situasjonane") }));
    scen.forEach(function (s) {
      var mitt = svar[s.id];
      var f = el("div", { class: "fasit" });
      f.appendChild(el("h3", { text: L(s.fasit.tittel) }));
      if (mitt) {
        var p = el("p", { class: "ditt" }, [u("duValde") + ": ", el("b", { text: valTekst(s, mitt) })]);
        f.appendChild(p);
        if (s.rett.indexOf(mitt) > -1) f.appendChild(el("p", { class: "merk", html: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>' + u("rett") }));
      } else f.appendChild(el("p", { class: "ditt", text: u("hoppa") }));
      f.appendChild(el("p", { text: L(s.fasit), style: "margin-top:8px" }));
      sit.appendChild(f);
    });
    if (scen.length) d.appendChild(sit);

    // Råd (berre i skjema som har dei)
    if (!F.tips.length) { d.appendChild(kontaktSek()); d.appendChild(el("p", { class: "helsing", text: u("lukk") })); main.appendChild(d); return; }
    var treff = F.tips.filter(function (t) { try { return t.naar(svar); } catch (e) { return false; } });
    var avslutt = treff.filter(function (t) { return t.avslutning; });
    var aktuelle = treff.filter(function (t) { return !t.avslutning; }).slice(0, K.maksTips);
    var radSek = el("section");
    radSek.appendChild(el("h2", { text: u("rad") }));
    if (!aktuelle.length) {
      // Ros berre når vi har nok svar til å meine noko. Elles eit nøytralt råd.
      var alleSp = spSteg();
      var svara = alleSp.filter(function (q) { return !tomt(svar[q.id]); }).length;
      radSek.appendChild(el("p", { class: "hjelp", text: u(svara * 2 >= alleSp.length ? "ingenRad" : "litenData") }));
      aktuelle = F.tips.filter(function (t) { return t.reserve; }).slice(0, 1);
    }
    var tl = el("div", { class: "tips" });
    var visKontakt = false;
    aktuelle.forEach(function (t) {
      if (t.visKontakt) visKontakt = true;
      tl.appendChild(el("article", null, [el("h3", { text: L(t.tittel) }), el("p", { text: L(t) })]));
    });
    radSek.appendChild(tl);
    avslutt.forEach(function (t) {
      radSek.appendChild(el("div", { style: "margin-top:26px" }, [el("h3", { text: L(t.tittel), style: "margin:0 0 6px;font-size:1.1rem" }), el("p", { text: L(t), style: "margin:0" })]));
    });
    d.appendChild(radSek);

    d.appendChild(kontaktSek());
    d.appendChild(el("p", { class: "helsing", text: u("lukk") }));
    main.appendChild(d);
  }
  function kontaktSek() {
    var kSek = el("section");
    kSek.appendChild(el("h2", { text: u("kontakt") }));
    kSek.appendChild(el("div", { class: "kontakt" }, [
      el("div", null, [el("span", { text: K.kontakt.telefon })]),
      el("div", null, [el("span", { text: K.kontakt.epost })]),
      el("small", { text: L(K.kontakt.tider) })
    ]));
    return kSek;
  }

  /* ---------- Hendingar ---------- */
  bVidare.addEventListener("click", function () {
    if (bVidare.disabled) return;
    fram();
  });
  bTilbake.addEventListener("click", bak);
  bHopp.addEventListener("click", hopp);
  document.querySelectorAll(".sprak button").forEach(function (b) {
    b.addEventListener("click", function () { tilstand.lang = b.getAttribute("data-l"); lagre(); teikn(); });
  });

  // Sjekk at lenkja har rett kode før folk byrjar å svare (ikkje i førehandsvisinga)
  if (!erForhand) {
    fetch("api/sjekk?k=" + encodeURIComponent(kundeSlug) + "&t=" + encodeURIComponent(tilgang))
      .then(function (r) { if (r.status === 403) { tilstand.ugyldig = true; teikn(); } else if (r.status === 410) { tilstand.stengd = true; teikn(); } })
      .catch(function () {});
  }
  if (F) last();
  if (F && tilstand.steg >= steg().length) tilstand.steg = steg().length - 1;
  teikn();
})();
</script>
