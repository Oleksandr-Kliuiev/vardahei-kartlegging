<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varde admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:ital,wght@0,300..800;1,400..500&display=swap">
<link rel="stylesheet" href="varde.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<div class="skal" id="skal">
  <aside class="sidemeny" id="sidemeny" aria-label="Hovudmeny">
    <div class="merke">
      <span class="logo-plate"><img class="logo" src="vardahei-it-logo.png" alt="Vardahei IT" width="115" height="23"></span>
    </div>
    <div class="produkt"><span class="produkt-namn">Varde</span><span class="produkt-sub">Kartlegging · seminar · oppfølging</span></div>
    <button type="button" class="sok" id="sok-knapp"><svg class="icon sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Søk eller hopp til …</span><kbd>⌘K</kbd></button>
    <nav class="nav" id="nav"></nav>
    <div class="sidemeny-fot">
      <div class="sanntid" id="sanntid" role="status"><span class="live-dot"></span><span>Oppdatert i sanntid</span></div>
      <div class="meg"><span class="avatar" aria-hidden="true">OK</span><span class="meg-namn">Oleksandr<small>oleksandr@vardahei.no</small></span><button type="button" class="ikonknapp" aria-label="Logg ut" title="Logg ut"><svg class="icon sm" viewBox="0 0 24 24"><path d="M15 4h4v16h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg></button></div>
    </div>
  </aside>
  <div class="hovud">
    <header class="topplinje" id="topplinje">
      <button type="button" class="ikonknapp menyknapp" id="menyknapp" aria-label="Opne menyen" aria-expanded="false" aria-controls="sidemeny"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="sti-nav" aria-label="Brødsmular" id="smular"></nav>
      <div class="topp-hogre">
        <span class="chip warn" title="Tala i prototypen er døme, ikkje ekte svar">Eksempeldata</span>
        <div class="seg" id="tema" role="group" aria-label="Tema"><button type="button" data-v="light" aria-pressed="false" aria-label="Lys"><svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-v="dark" aria-pressed="false" aria-label="Mørk"><svg class="icon sm" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button></div>
      </div>
    </header>
    <main class="side" id="side" tabindex="-1"></main>
  </div>
</div>
<div class="slor" id="slor" hidden></div>
<aside class="skuff" id="skuff" hidden aria-modal="true" role="dialog" aria-labelledby="skuff-tittel"></aside>
<div class="palett-bakgrunn" id="palett-bg" hidden></div>
<div class="palett" id="palett" hidden role="dialog" aria-modal="true" aria-label="Søk og hopp">
  <div class="palett-sok"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="palett-input" type="text" placeholder="Skriv ein kunde, ei side eller ei handling" autocomplete="off" aria-controls="palett-liste"><kbd>Esc</kbd></div>
  <ul class="palett-liste" id="palett-liste" role="listbox"></ul>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="varde-motion.js"></script>
<script src="survey-data.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
