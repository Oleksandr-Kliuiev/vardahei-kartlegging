<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varde spørjeskjema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:ital,wght@0,300..800;1,400..500&display=swap">
<link rel="stylesheet" href="varde.css">
<style>
/* Spørjeskjemaet: éin smal kolonne, eitt spørsmål om gongen. Landskapet øvst er framdrifta:
   turgåaren går stien, kvar seksjon er ein varde, og på toppen ventar telt og bål. */
:root { --stjerner: 0; --kolonne: 40rem; --landskap: 56rem; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stjerner: 1; } }
:root[data-theme="dark"] { --stjerner: 1; }

html, body { min-height: 100%; }
body.runner { font-size: 17px; line-height: 1.55; overflow-x: hidden; }
.topbar { max-width: var(--landskap); margin: 0 auto; padding: 14px 20px 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topbar .logo { height: 24px; }
.forhand-merke { display: none; }
.forhand .forhand-merke { display: inline-flex; }
.forhand #sprak { display: none; }

/* Landskapet. Høgda og viewBox blir tweena av JS, så kameraet glid mellom intro, sti og topp. */
.landskap { position: relative; margin: 6px 0 0; height: 180px; }
.landskap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.boble {
  position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; white-space: nowrap;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
  color: var(--on-accent); background: var(--accent); border-radius: 8px; padding: 5px 8px 5px; box-shadow: var(--shadow-2);
  transition: opacity var(--t-base) var(--ease-sti), background-color var(--t-base);
}
/* Pila peikar alltid ned mot turgåaren, også når bobla har glidd til sida */
.boble::after { content: ""; position: absolute; left: var(--pil, 50%); bottom: -4px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--accent); }
.boble[data-skjult="true"] { opacity: 0; }
.boble .rull { display: inline-block; min-width: 1.2ch; text-align: right; }
/* Teksten blir klipt når bobla endrar breidd (pila utanfor blir ikkje klipt); litt luft over og under for p og g */
.boble-tekst { display: block; overflow: hidden; padding: 2px 0; margin: -2px 0; }

.as-bak { fill: var(--as-bak); } .as-midt { fill: var(--as-midt); } .as-fram { fill: var(--as-fram); }
.sno { fill: var(--sno); opacity: .85; }
.sti-att { fill: none; stroke: var(--sti-att); stroke-width: 1.25; stroke-dasharray: 1.4 3; stroke-linecap: round; opacity: .9; }
.sti-gjort { fill: none; stroke: var(--sti-gjort); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.sti-fram { fill: none; stroke: var(--sti-gjort); stroke-width: 1.4; stroke-dasharray: 1.4 3; stroke-linecap: round; opacity: 0; transition: opacity var(--t-base); }
.landskap[data-forslag="true"] .sti-fram { opacity: .9; }
.prikk { transform-box: fill-box; transform-origin: center; fill: var(--prikk); stroke: var(--sti-att); stroke-width: 1.1; transition: fill var(--t-base) var(--ease-sti), stroke var(--t-base) var(--ease-sti); }
.prikk.svart { fill: var(--sti-gjort); stroke: var(--sti-gjort); }
.prikk.hoppa { fill: var(--prikk); stroke: var(--sti-gjort); stroke-width: 1.4; }
/* Leiarstega før leiaren har valt: synlege, men tydeleg valfrie */
.prikk.valfri { fill: var(--prikk); stroke: var(--sti-att); stroke-width: 1; stroke-dasharray: 1.3 1.1; opacity: .75; }
.varde .helle { stroke: var(--stein-mork); stroke-width: .35; stroke-linejoin: round; }
.varde .h0 { fill: var(--stein); } .varde .h1 { fill: var(--stein-lys); } .varde .h2 { fill: color-mix(in oklab, var(--stein) 60%, var(--stein-lys)); }
.varde .min-stein { fill: var(--accent); stroke: color-mix(in oklab, var(--accent) 70%, #000); stroke-width: .3; opacity: 0; }
.varde .min-stein.lagt { opacity: 1; }
.flyg-stein { fill: var(--accent); stroke: color-mix(in oklab, var(--accent) 70%, #000); stroke-width: .3; }
.gran-a { fill: var(--gran); } .gran-b { fill: var(--gran-lys); } .stamme { fill: var(--stamme); }

/* Himmel og stemning */
.kveld { opacity: 0; transition: opacity calc(1400ms * var(--motion-scale)) var(--ease-sti); }
.ferdig .kveld, [data-stemning="kveld"] .kveld { opacity: 1; }
.sol { fill: var(--sol); opacity: 0; transition: opacity var(--t-move) var(--ease-sti), transform calc(2600ms * var(--motion-scale)) var(--ease-sti); transform-box: fill-box; transform-origin: center; }
[data-kamera="hero"] .sol, [data-kamera="topp"] .sol { opacity: .72; }
.ferdig .sol { transform: translateY(16px); }
.stjerner circle { fill: #e9eef3; opacity: 0; }
.ferdig .stjerner circle, [data-stemning="kveld"] .stjerner circle { animation: blink calc(3200ms * var(--motion-scale)) ease-in-out infinite alternate; }
@keyframes blink { from { opacity: calc(var(--stjerner) * .15); } to { opacity: calc(var(--stjerner) * .9); } }
.take { opacity: 0; transition: opacity calc(900ms * var(--motion-scale)); }
[data-stemning="take"] .take { opacity: 1; }
.take rect { fill: var(--bg); }
.take .t1 { animation: drift calc(16s * var(--motion-scale)) ease-in-out infinite alternate; }
.take .t2 { animation: drift calc(22s * var(--motion-scale)) ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
.skilt { opacity: 0; transition: opacity var(--t-move); }
[data-stemning="take"] .skilt { opacity: 1; }

/* Turgåaren: beina går berre medan han flyttar seg, pustar litt når han står */
.bein { transform: rotate(0deg); }
/* Steglengd og fart heng saman: eitt beinsving per ~7 einingar, så føtene ikkje sklir */
.gaar-no .bein.a { animation: steg-a calc(180ms * var(--motion-scale)) ease-in-out infinite alternate; }
.gaar-no .bein.b { animation: steg-b calc(180ms * var(--motion-scale)) ease-in-out infinite alternate; }
.gaar-no .kropp { animation: vugge calc(180ms * var(--motion-scale)) ease-in-out infinite alternate; }
@keyframes steg-a { from { transform: rotate(-24deg); } to { transform: rotate(22deg); } }
@keyframes steg-b { from { transform: rotate(22deg); } to { transform: rotate(-24deg); } }
@keyframes vugge { from { transform: translateY(0); } to { transform: translateY(-1.1px); } }
.kvile .kropp { animation: pust calc(2600ms * var(--motion-scale)) ease-in-out infinite alternate; }
@keyframes pust { from { transform: translateY(0); } to { transform: translateY(-.5px); } }
/* Vinking på toppen (etter at steinen er lagd): den andre armen går opp på skrå framfor hovudet,
   vinkar to gonger og går ned att. Fremre arm held staven heile tida. */
.vinkearm { opacity: 0; transform: rotate(165deg); }
.vinkar .vinkearm { animation: vink calc(1800ms * var(--motion-scale)) ease-in-out calc(350ms * var(--motion-scale)) 1 both; }
@keyframes vink { 0% { opacity: 0; transform: rotate(165deg); } 10% { opacity: 1; } 26% { transform: rotate(34deg); } 41% { transform: rotate(58deg); } 56% { transform: rotate(32deg); } 71% { transform: rotate(56deg); } 84% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; transform: rotate(165deg); } }

/* Telt og bål: reiser seg når svara er sende */
.telt, .baal, .glod { opacity: 0; transform: scale(0); transform-box: fill-box; transform-origin: 50% 100%; }
.ferdig .telt { animation: reis calc(720ms * var(--motion-scale)) var(--ease-sprett) calc(1000ms * var(--motion-scale)) forwards; }
.ferdig .baal { animation: reis calc(560ms * var(--motion-scale)) var(--ease-sprett) calc(1500ms * var(--motion-scale)) forwards; }
.ferdig .glod { animation: glod calc(2400ms * var(--motion-scale)) ease-in-out calc(1700ms * var(--motion-scale)) infinite alternate both; transform-origin: 50% 50%; }
@keyframes reis { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
@keyframes glod { from { opacity: .35; transform: scale(.9); } to { opacity: .7; transform: scale(1.1); } }
.flamme { transform-box: fill-box; transform-origin: 50% 100%; }
.ferdig .flamme.f1 { animation: flakk calc(450ms * var(--motion-scale)) ease-in-out infinite alternate; }
.ferdig .flamme.f2 { animation: flakk calc(380ms * var(--motion-scale)) calc(100ms * var(--motion-scale)) ease-in-out infinite alternate-reverse; }
.ferdig .flamme.f3 { animation: flakk calc(520ms * var(--motion-scale)) calc(200ms * var(--motion-scale)) ease-in-out infinite alternate; }
@keyframes flakk { from { transform: scale(1, 1) skewX(0deg); } to { transform: scale(.85, 1.18) skewX(-6deg); } }
.gnist { opacity: 0; }
.ferdig .gnist { animation: gnist calc(1600ms * var(--motion-scale)) ease-out calc(1800ms * var(--motion-scale)) infinite; }
.ferdig .gnist.g2 { animation-delay: calc(2350ms * var(--motion-scale)); }
.ferdig .gnist.g3 { animation-delay: calc(2900ms * var(--motion-scale)); }
@keyframes gnist { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(3px, -16px); } }

/* Innhald */
.app { max-width: var(--kolonne); margin: 0 auto; padding: 4px 20px calc(132px + env(safe-area-inset-bottom, 0px)); }
#stage { outline: none; }
h1[tabindex="-1"]:focus { outline: none; }
.skjerm { padding-top: 14px; }
.seksjon { display: inline-flex; align-items: center; gap: 8px; }
.seksjon svg { width: 16px; height: 16px; }
.sp-hovud { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; min-height: 22px; }
.sp-nr { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .sp-nr { display: none; } }
.sp { font-size: clamp(1.42rem, 5.2vw, 1.85rem); line-height: 1.24; font-weight: 720; letter-spacing: -0.012em; color: var(--ink-strong); }
.hjelp { margin-top: 10px; color: var(--ink-muted); font-size: 16px; }
.val { display: grid; gap: 10px; margin-top: 22px; }
.opt {
  position: relative; display: grid; grid-template-columns: 26px 1fr; gap: 14px; align-items: center; width: 100%; min-height: 58px;
  padding: 14px 16px; text-align: left; border-radius: var(--r-lg); background: var(--surface); border: 1.5px solid var(--line);
  color: var(--ink-strong); font-size: 17px; font-weight: 500; line-height: 1.35; box-shadow: var(--shadow-1), var(--edge);
  transition: border-color var(--t-quick) var(--ease-sti), background-color var(--t-quick) var(--ease-sti), box-shadow var(--t-base) var(--ease-sti),
    transform var(--t-spring) var(--ease-fjor), font-weight var(--t-base) var(--ease-sti), opacity var(--t-base);
}
.opt:hover { border-color: var(--line-strong); }
.opt:active { transform: scale(.985); transition-duration: var(--t-tap); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 680; box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }
.opt[aria-disabled="true"] { opacity: .45; }
.opt .ind { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; transition: border-color var(--t-quick), background-color var(--t-quick); }
.opt .ind::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--on-accent); transform: scale(0); transition: transform var(--t-spring) var(--ease-sprett); }
.opt[aria-checked="true"] .ind { border-color: var(--accent); background: var(--accent); }
.opt[aria-checked="true"] .ind::after { transform: scale(1); }
.opt[role="checkbox"] .ind { border-radius: 7px; }
.opt[role="checkbox"] .ind::after { display: none; }
.opt[role="checkbox"] .ind svg { width: 16px; height: 16px; fill: none; stroke: var(--on-accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset var(--t-base) var(--ease-inn); }
.opt[role="checkbox"][aria-checked="true"] .ind svg { stroke-dashoffset: 0; }
.teljar { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 14px; font-weight: 650; color: var(--accent-text); min-height: 22px; }

/* Initialar: fem ruter som fyllast éin og éin bokstav */
.ruter { position: relative; display: inline-flex; gap: 8px; margin-top: 22px; padding: 4px; border-radius: var(--r-lg); }
.ruter:focus-within { box-shadow: 0 0 0 2px var(--focus); }
.ruter input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; text-transform: uppercase; caret-color: transparent; z-index: 1; }
.rute {
  width: 50px; height: 60px; display: grid; place-items: center; border-radius: var(--r-md); background: var(--surface); border: 1.5px solid var(--line-strong);
  font-family: var(--font-mono); font-size: 26px; font-weight: 700; color: var(--ink-strong); transition: border-color var(--t-quick), background-color var(--t-quick);
}
.rute.fylt { border-color: var(--accent); background: var(--accent-soft); }
.rute.plass { color: var(--ink-muted); opacity: .4; font-weight: 500; }
.rute.no::after { content: ""; width: 2px; height: 28px; background: var(--accent); border-radius: 2px; animation: blink-caret calc(1000ms * var(--motion-scale)) steps(1) infinite; }
.ruter:not(:focus-within) .rute.no::after { display: none; }
@keyframes blink-caret { 50% { opacity: 0; } }
@media (max-width: 380px) { .rute { width: 44px; height: 54px; font-size: 23px; } .ruter { gap: 6px; } }

textarea.fritekst { width: 100%; min-height: 128px; margin-top: 22px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); border: 1.5px solid var(--line-strong); color: var(--ink-strong); font-size: 17px; line-height: 1.5; resize: none; overflow: hidden; transition: border-color var(--t-quick), box-shadow var(--t-quick); }
textarea.fritekst:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent); }
.fri-merk { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; color: var(--ink-muted); }

/* Skala og NPS: tommelen glid til valet */
.skala { margin-top: 26px; }
.skala-spor { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; padding: 5px; border-radius: var(--r-lg); background: var(--bg-sunken); border: 1px solid var(--line); }
.skala-spor button { position: relative; z-index: 1; min-height: 50px; border: 0; border-radius: 11px; background: transparent; font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--ink); transition: color var(--t-quick); }
.skala-spor button[aria-checked="true"] { color: var(--on-accent); }
.skala-tommel { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 0; border-radius: 11px; background: var(--accent); box-shadow: var(--shadow-2); opacity: 0; transform: scale(.6);
  transition: transform var(--t-spring) var(--ease-fjor), width var(--t-spring) var(--ease-fjor), opacity var(--t-quick); }
.skala-endar { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 14.5px; color: var(--ink-muted); }
.nps .skala-spor { --n: 11; gap: 3px; }
.nps .skala-spor button { font-size: 16px; min-height: 48px; }
@media (max-width: 480px) { .nps .skala-spor { grid-template-columns: repeat(6, 1fr); } .nps .skala-tommel { display: none; } .nps .skala-spor button[aria-checked="true"] { background: var(--accent); } }
.fri { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-move) var(--ease-sti); }
.fri[data-open="true"] { grid-template-rows: 1fr; }
.fri > div { overflow: hidden; }
.fri label { display: block; padding-top: 20px; font-size: 15px; font-weight: 600; color: var(--ink); }
.fri textarea.fritekst { margin-top: 8px; min-height: 96px; }

/* Intro */
.intro h1 { font-size: clamp(2.15rem, 8vw, 3rem); line-height: 1.04; font-weight: 800; letter-spacing: -0.026em; margin: 10px 0 18px; }
.brev { display: grid; gap: 14px; max-width: 34em; }
.kunde { display: inline-block; padding: 1px 9px; border-radius: 8px; background: var(--accent-soft); color: var(--ink-strong); font-weight: 700; }
.fakta { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 12px; }
.fakta li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.fakta svg { margin-top: 3px; color: var(--accent); }
.personvern { margin-top: 22px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--edge); }
.personvern-topp { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 16px 16px 4px; }
.personvern-topp .merke { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.personvern h2 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.personvern p { font-size: 15.5px; color: var(--ink); }
.personvern .meir { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-move) var(--ease-sti); }
.personvern .meir[data-open="true"] { grid-template-rows: 1fr; }
.personvern .meir > div { overflow: hidden; }
.personvern .meir ul { margin: 8px 16px 0 64px; padding-bottom: 16px; padding: 0; display: grid; gap: 10px; font-size: 15px; color: var(--ink); }
.personvern .linkbtn { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 8px 58px; }
.personvern .linkbtn svg { transition: transform var(--t-base) var(--ease-fjor); }
.personvern .linkbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.helsing { margin-top: 24px; color: var(--ink-muted); font-style: italic; }
.utkast { display: grid; gap: 12px; padding: 16px; margin-bottom: 18px; border-radius: var(--r-lg); background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); }
.utkast h2 { font-size: 17px; }
.utkast .knappar { display: flex; flex-wrap: wrap; gap: 8px; }

/* Leiardelen */
.mellom h1, .oversyn h1, .slutt h1, .tilstand h1 { font-size: clamp(1.8rem, 6.4vw, 2.4rem); line-height: 1.1; font-weight: 780; letter-spacing: -0.02em; margin: 10px 0 14px; }
.aerleg { display: grid; grid-template-columns: 22px 1fr; gap: 12px; margin-top: 18px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--warning-bg); color: var(--warning-fg); border: 1px solid var(--warning-line); font-size: 15.5px; }
.vegval { display: grid; gap: 12px; margin-top: 24px; }
.veg { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px; width: 100%; padding: 18px; text-align: left; border-radius: var(--r-xl); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-strong); box-shadow: var(--shadow-1), var(--edge);
  transition: border-color var(--t-quick), transform var(--t-spring) var(--ease-fjor), box-shadow var(--t-base); }
.veg:hover { border-color: var(--accent); box-shadow: var(--shadow-2); }
.veg:active { transform: scale(.985); }
.veg b { font-size: 18px; } .veg span { grid-column: 1; color: var(--ink-muted); font-size: 15px; }
.veg svg { grid-row: 1 / span 2; grid-column: 2; color: var(--accent); transition: transform var(--t-spring) var(--ease-fjor); }
.veg:hover svg { transform: translateX(4px); }
.veg.hoved { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.veg.hoved span, .veg.hoved svg { color: color-mix(in oklab, var(--on-accent) 82%, transparent); }

/* Oversyn før sending */
.seksjonar { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
.seksjonar > li { border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--edge); }
.seksjon-knapp { width: 100%; display: grid; grid-template-columns: 22px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; color: var(--ink-strong); font-weight: 650; min-height: 54px; }
.seksjon-knapp .tal { font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.seksjon-knapp .pil { transition: transform var(--t-base) var(--ease-fjor); }
.seksjon-knapp[aria-expanded="true"] .pil { transform: rotate(180deg); }
.seksjon-svar { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-move) var(--ease-sti); }
.seksjon-svar[data-open="true"] { grid-template-rows: 1fr; }
.seksjon-svar > div { overflow: hidden; }
.seksjon-svar dl { margin: 0; padding: 0 16px 12px 50px; display: grid; gap: 12px; }
.seksjon-svar dt { font-size: 14.5px; color: var(--ink-muted); }
.seksjon-svar dd { margin: 2px 0 0; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-weight: 650; color: var(--ink-strong); }
.seksjon-svar dd .linkbtn { padding: 2px 4px; font-size: 14px; }
.lagra { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 15px; color: var(--ink-muted); }
.feilmelding { display: grid; grid-template-columns: 22px 1fr; gap: 12px; margin-top: 18px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--danger-bg); color: var(--danger-fg); border: 1px solid var(--danger-line); font-weight: 600; }

/* Toppen */
.slutt .ingress { font-size: 18px; max-width: 32em; }
.kva-skjer { margin-top: 28px; font-size: 18px; }
.steg { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 0; }
.steg li { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding-bottom: 18px; }
.steg li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.steg li:last-child::before { display: none; }
.steg .nr { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--line-strong); font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink-muted); }
.steg li.gjort .nr { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steg li.no .nr { border-color: var(--accent); color: var(--accent-text); }
.steg p { padding-top: 2px; }
.kontakt { margin-top: 26px; padding: 18px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; box-shadow: var(--edge); }
.kontakt h2 { font-size: 18px; }
.kontakt-rad { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.kontakt-rad b { user-select: all; font-variant-numeric: tabular-nums; }
.lukk { margin-top: 22px; color: var(--ink-muted); font-style: italic; }

.tilstand .ikon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--accent-text); box-shadow: var(--shadow-1); }
.tilstand .ikon svg { width: 26px; height: 26px; }
.tilstand p { max-width: 32em; }

/* Handlingslinja nedst: knappane flyttar seg med FLIP når settet endrar seg */
.handling {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in oklab, var(--bg) 84%, transparent); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-top: 1px solid var(--line); transition: transform var(--t-move) var(--ease-sti), opacity var(--t-move);
}
.handling[data-skjult="true"] { transform: translateY(110%); opacity: 0; }
.handling-inn { max-width: var(--kolonne); margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.handling .neste { margin-left: auto; min-width: 128px; }
.handling .neste.full { flex: 1; }
.handling .linkbtn { min-height: 44px; }
.sprak-topp .seg button, #sprak button { min-height: 36px; }
@media (max-width: 380px) {
  .handling-inn { gap: 4px; }
  #b-tilbake .lbl { display: none; }
  #b-tilbake { padding-inline: 12px; }
  .handling .neste { min-width: 0; padding-inline: 18px; }
}
.handling .neste svg { transition: transform var(--t-spring) var(--ease-fjor); }
.handling .neste:not([disabled]):hover svg { transform: translateX(3px); }
.handling .neste.vakna { animation: vakna var(--t-spring) var(--ease-sprett); }
@keyframes vakna { 0% { transform: scale(.94); } 100% { transform: scale(1); } }
.spinn { width: 18px; height: 18px; border-radius: 50%; border: 2.4px solid color-mix(in oklab, currentColor 30%, transparent); border-top-color: currentColor; animation: spinn calc(700ms * var(--motion-scale)) linear infinite; }
@keyframes spinn { to { transform: rotate(360deg); } }

/* Prototype-dokka: berre når sida står åleine */
.proto { position: fixed; z-index: 40; left: 0; top: 50%; }
.innebygd .proto { display: none; }
.proto-knapp { width: 18px; height: 52px; margin-top: -26px; padding: 0; border-radius: 0 10px 10px 0; display: grid; place-items: center; background: var(--ink-strong); color: var(--bg); border: 0; box-shadow: var(--shadow-2); opacity: .55; transition: opacity var(--t-quick), width var(--t-base) var(--ease-fjor); }
.proto-knapp:hover, .proto-knapp[aria-expanded="true"] { opacity: 1; width: 26px; }
.proto-knapp svg { width: 14px; height: 14px; }
.proto-ark { position: absolute; left: 30px; top: -220px; width: min(320px, calc(100vw - 42px)); max-height: min(72vh, 560px); overflow: auto; padding: 14px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-3); transform-origin: 0 50%; }
.proto-ark h3 { font-size: 12px; font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 10px 0 8px; }
.proto-ark h3:first-child { margin-top: 0; }
.proto-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.proto-grid button { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-full); padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--ink); }
.proto-grid button:hover { border-color: var(--accent); color: var(--accent-text); }
.proto-ark .seg { margin-bottom: 4px; }
.proto-merk { margin-top: 12px; font-size: 12.5px; color: var(--ink-muted); }
</style>
</head>
