packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm 11 reads settings only from this file (not from package.json "pnpm" field, not from .npmrc).
# Required by `pnpm deploy --filter @varde/api` in infra/Dockerfile (0.2).
injectWorkspacePackages: true

# pnpm >= 10 does not run dependency build scripts unless allowed (0.4).
allowBuilds:
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  # tsx -> esbuild: its postinstall only verifies the platform binary (optional dependency).
  esbuild: false

# @nestjs/platform-fastify 11.2.7 pins fastify 5.11.3, which has known advisories fixed in 5.12.x
# (improvement plan 0.4). Drop this once Nest moves to 12.
overrides:
  fastify: 5.12.7
