# Local Postgres for development and integration tests (task 0.4).
# The password is a local dev literal, not a secret; the port is bound to 127.0.0.1 only.
#   docker compose -f infra/compose.dev.yml up -d     (VARDE_DEV_PG_PORT overrides 5433 if taken)
#   DATABASE_URL=postgresql://varde:varde-dev@127.0.0.1:5433/varde_dev
name: varde-dev
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: varde
      POSTGRES_PASSWORD: varde-dev
      POSTGRES_DB: varde_dev
    ports:
      - '127.0.0.1:${VARDE_DEV_PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U varde -d varde_dev']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
