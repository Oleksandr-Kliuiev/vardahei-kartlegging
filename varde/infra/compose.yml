# Production compose of Varde on the shared VPS (task 0.6). Lives in /opt/varde/compose.yml.
# Image tags = commit sha: VARDE_SHA in /opt/varde/.env (written by the deploy, infra/README.md).
#   docker compose -f /opt/varde/compose.yml up -d
# CI: docker compose -f infra/compose.yml --env-file infra/ci.env config
name: varde

services:
  app:
    image: varde-api:${VARDE_SHA:-unset}
    container_name: varde-app
    restart: unless-stopped
    # Compose >= 2.24: `config` works without the file (CI, a fresh machine).
    env_file:
      - path: /etc/varde/app.env
        required: false
    networks: [atlas_edge, atlas_internal]
    # No published ports: Caddy reaches varde-app:3000 by container name.
    volumes:
      # Break-glass socket directory (0.8): a missing directory is a loud error, not root 0755.
      - type: bind
        source: /var/lib/varde/run
        target: /run/varde
        bind: { create_host_path: false }
      # Export of the deletion ledger (0.10e, deferred 13.10), written by uid 1000.
      - type: bind
        source: /var/lib/varde/ledger-out
        target: /var/lib/varde/ledger-out
        bind: { create_host_path: false }
      # Public age keys for the ledger export (0.10e, deferred 13.10).
      - type: bind
        source: /etc/varde/recipients.txt
        target: /etc/varde/recipients.txt
        read_only: true
        bind: { create_host_path: false }
      # Entra client key and certificate (0.7, private_key_jwt), group 1000 may read.
      - type: bind
        source: /etc/varde/entra
        target: /etc/varde/entra
        read_only: true
        bind: { create_host_path: false }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    mem_limit: 512m

  # Backup (IMPROVEMENT-PLAN 0.1, infra/backup/): not started by `up -d`; systemd runs
  #   docker compose -f /opt/varde/compose.yml --profile backup run --rm -T backup /kit/backup.sh nightly|ledger
  # CMD (not ENTRYPOINT) is backup.sh nightly, so `run --rm backup psql …` runs psql. The image holds only
  # the tools; it is built on the VPS from infra/backup/Dockerfile (README §5.2), not per commit.
  backup:
    image: varde-backup:${VARDE_BACKUP_TAG:-pg17-1}
    profiles: [backup]
    env_file:
      - path: /etc/varde/backup.env
        required: false
    networks: [atlas_internal]
    volumes:
      - type: bind
        source: /opt/varde/backup
        target: /kit
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /etc/varde/recipients.txt
        target: /run/varde/recipients.txt
        read_only: true
        bind: { create_host_path: false }
      # rclone.conf with the SharePoint app secret: a writable directory, because rclone saves a refreshed
      # token by renaming a temp file next to the config (a single-file bind cannot be renamed over).
      - type: bind
        source: /etc/varde/rclone
        target: /run/varde/rclone
        bind: { create_host_path: false }
      - type: bind
        source: /opt/varde/VERSION
        target: /run/varde/VERSION
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /opt/varde/images
        target: /run/varde/images
        read_only: true
        bind: { create_host_path: false }
      # Hash of the last uploaded ledger export (backup.sh ledger skips an unchanged one).
      - type: bind
        source: /var/lib/varde/backup-state
        target: /var/lib/varde-backup
        bind: { create_host_path: false }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  atlas_edge:
    external: true
  atlas_internal:
    external: true
