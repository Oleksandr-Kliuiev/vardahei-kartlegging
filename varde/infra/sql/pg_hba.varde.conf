# Varde (task 0.5b, decision 13.10 "Isolation of the varde database"). Insert these three lines
# BEFORE the first general `host` line of the active pg_hba.conf (SHOW hba_file).
# TCP into varde: only the Varde roles. Varde roles over TCP: nowhere but varde.
# No `local … reject`: the unix socket inside the container stays the only superuser channel.
host    varde   varde_app,varde_backup   all   scram-sha-256
host    all     varde_app,varde_backup   all   reject
host    varde   all                      all   reject
