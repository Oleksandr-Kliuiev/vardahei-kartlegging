# CI for the Varde platform (varde/). kartlegging/ is not built or tested here.
name: varde

on:
  push:
    branches: [main, 'varde/**']
    paths: ['varde/**', 'docs/varde/**', '.github/workflows/varde.yml']
  pull_request:
    paths: ['varde/**', 'docs/varde/**', '.github/workflows/varde.yml']

permissions:
  contents: read

concurrency:
  group: varde-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: varde

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: varde/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: varde/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm budget
      - run: pnpm budget:selfcheck
      - run: pnpm lint:privacy:selfcheck

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build api image (linux/amd64, no push)
        run: docker buildx build --platform linux/amd64 -f infra/Dockerfile . -t varde-api:ci --load
      - name: Container starts without a database
        run: |
          cid=$(docker run --rm -d --network host -e DATABASE_URL=postgresql://x:x@127.0.0.1:1/x varde-api:ci)
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true || { docker logs "$cid"; exit 1; }
          docker stop "$cid"
      - name: Config files are in the image
        run: docker run --rm varde-api:ci test -f /out/config/db-budget.json

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: varde/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm secrets
      - run: pnpm secrets:selfcheck
