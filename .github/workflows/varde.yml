# CI for the Varde platform (varde/). kartlegging/ is not built or tested here.
name: varde

on:
  push:
    branches: [main, 'varde/**']
    paths: ['varde/**', 'docs/varde/**', '.github/workflows/varde.yml', 'kartlegging/**']
  pull_request:
    paths: ['varde/**', 'docs/varde/**', '.github/workflows/varde.yml', 'kartlegging/**']

permissions:
  contents: read

concurrency:
  group: varde-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: varde

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tools/convert reads sporsmal.js of f26ee21 (KI 2026-10-12)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: varde/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: varde/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm budget
      - run: pnpm budget:selfcheck
      - run: pnpm lint:privacy:selfcheck

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: varde
          POSTGRES_PASSWORD: varde-ci
          POSTGRES_DB: varde_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U varde -d varde_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Test literal of the CI service container, not a secret.
      VARDE_RESTORE_DOCKER: '1'
      DATABASE_URL: postgresql://varde:varde-ci@127.0.0.1:5432/varde_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # invariants:0a includes the secret-scan of history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: varde/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: varde/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varde/api db:migrate
      - run: pnpm --filter @varde/runner build
      - run: pnpm --filter @varde/admin build
      - run: pnpm --filter @varde/api test:integration
      - run: pnpm invariants:0a
      - run: pnpm invariants:0b
      - run: pnpm invariants:0c
      - run: pnpm invariants:1a
      - run: pnpm invariants:1b:runner
      - run: pnpm invariants:1b
      - run: node ../tools/test/lesemodus.test.js
      - run: bash infra/caddy/test/caddy-legacy.test.sh
      - run: bash infra/ops/test/deploy.test.sh
      - run: pnpm invariants:1c
      - run: pnpm invariants:1e
      - run: pnpm invariants:5
      - run: pnpm invariants:2a
      - run: pnpm invariants:3a
      - run: pnpm invariants:3b
      - run: pnpm invariants:3c

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: varde
          POSTGRES_PASSWORD: varde-ci
          POSTGRES_DB: varde_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U varde -d varde_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build api image (linux/amd64, no push)
        run: >-
          docker buildx build --platform linux/amd64 -f infra/Dockerfile .
          --build-arg VARDE_VERSION=ci -t varde-api:ci --load
      - name: Container starts without a database
        run: |
          cid=$(docker run --rm -d --network host -e DATABASE_URL=postgresql://x:x@127.0.0.1:1/x varde-api:ci)
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true || { docker logs "$cid"; exit 1; }
          docker stop "$cid"
      - name: Runner is built into the image (1.12)
        run: docker run --rm varde-api:ci test -f /out/static/runner/index.html
      - name: Config files are in the image
        run: docker run --rm varde-api:ci test -f /out/config/db-budget.json
      - name: '@varde/schema is built to dist in the image (1.4b)'
        run: >-
          test "$(docker run --rm varde-api:ci node -e
          "import('@varde/schema/metrics/populations').then(()=>console.log('schema ok'))")" = 'schema ok'
      - name: migrate deploy from the image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql://varde:varde-ci@127.0.0.1:5432/varde_ci
          varde-api:ci node node_modules/prisma/build/index.js migrate deploy
      - name: GET /health from the image → 200 with version
        run: |
          cid=$(docker run --rm -d --network host -e PORT=3999 \
            -e DATABASE_URL=postgresql://varde:varde-ci@127.0.0.1:5432/varde_ci varde-api:ci)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3999/health && break; sleep 1; done
          body=$(curl -s http://127.0.0.1:3999/health)
          docker stop "$cid"
          test "$body" = '{"status":"ok","version":"ci","db":"ok"}'
      - name: Break-glass hash survives Compose env parsing (CLI inside the image)
        run: VARDE_IMAGE=varde-api:ci bash infra/test/break-glass-env.test.sh
      - name: compose config (prod compose without /etc/varde files)
        run: bash infra/test/compose-config.test.sh
      - name: Caddy fragments validate; error log has no query
        run: bash infra/caddy/test/caddy-log.test.sh
      - name: VPS metrics sampler on fixtures
        run: bash tools/metrics/test/vps-sample.test.sh

  e2e:
    runs-on: ubuntu-24.04
    # Admin and runner suites take 13-15 min on a runner since 2.5 and 5 (report, archive, Funn).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: varde
          POSTGRES_PASSWORD: varde-ci
          POSTGRES_DB: varde_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U varde -d varde_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Test literal of the CI service container, not a secret.
      DATABASE_URL: postgresql://varde:varde-ci@127.0.0.1:5432/varde_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: varde/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: varde/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @varde/api db:migrate
      - run: pnpm --filter "@varde/api..." build
      - run: pnpm --filter @varde/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @varde/admin e2e
      - name: runner e2e on its own database (admin e2e leaves rounds behind)
        run: |
          PGPASSWORD=varde-ci psql -h 127.0.0.1 -U varde -d varde_ci -c 'create database varde_e2e_runner'
          DATABASE_URL=postgresql://varde:varde-ci@127.0.0.1:5432/varde_e2e_runner pnpm --filter @varde/runner exec playwright test
      - name: Golden of the old dashboard on synthetic fixtures (1.2c)
        run: pnpm parity:golden --check && pnpm --filter @varde/tools-parity test:golden
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            varde/apps/admin/playwright-report
            varde/apps/runner/test-results
            docs/varde/evidence/stage-1/1.13e
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: varde/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm secrets
      - run: pnpm secrets:selfcheck
